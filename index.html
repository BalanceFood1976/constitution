<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>체질 자가진단 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      padding: 30px 20px;
      max-width: 640px;
      margin: 0 auto;
      text-align: left;
    }
    h2, p, label, button {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }
    h2 { font-size: 24px; margin-bottom: 10px; animation-delay: 0.2s; }
    p { margin-bottom: 20px; font-size: 16px; animation-delay: 0.4s; }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
    }
    input[type="checkbox"] { margin-right: 8px; }
    button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      animation-delay: 1.4s;
    }
    button:hover { background-color: #388e3c; }
    button:active { box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    label:nth-of-type(1) { animation-delay: 0.6s; }
    label:nth-of-type(2) { animation-delay: 0.7s; }
    label:nth-of-type(3) { animation-delay: 0.8s; }
    label:nth-of-type(4) { animation-delay: 0.9s; }
    label:nth-of-type(5) { animation-delay: 1.0s; }
    label:nth-of-type(6) { animation-delay: 1.1s; }
    label:nth-of-type(7) { animation-delay: 1.2s; }
    label:nth-of-type(8) { animation-delay: 1.3s; }
    label:nth-of-type(9) { animation-delay: 1.4s; }
    label:nth-of-type(10) { animation-delay: 1.5s; }

    .fade-out {
      opacity: 0;
      transition: opacity 0.6s ease-out;
    }
  </style>
</head>
<body class="fade-in">
  <h2>체질 자가진단 테스트</h2>
  <p>아래 문항을 체크해보세요!<br>해당되는 항목이 5개 이상이면 <strong>온체질</strong>, 아니면 <strong>냉체질</strong>입니다.</p>
  <form id="testForm">
    <label><input type="checkbox"/> 손발이 따뜻한 편이다</label>
    <label><input type="checkbox"/> 더운 날씨를 잘 견딘다</label>
    <label><input type="checkbox"/> 추운 곳에 오래 있으면 쉽게 몸이 굳는다</label>
    <label><input type="checkbox"/> 땀이 자주 나는 편이다</label>
    <label><input type="checkbox"/> 성격이 급하거나 활동적인 편이다</label>
    <label><input type="checkbox"/> 평소 열이 많다는 이야기를 자주 듣는다</label>
    <label><input type="checkbox"/> 피부가 건조하고 열감이 있다</label>
    <label><input type="checkbox"/> 감기에 걸려도 열감이 먼저 나타난다</label>
    <label><input type="checkbox"/> 더위를 더 잘 타는 편이다</label>
    <label><input type="checkbox"/> 따뜻한 음식보다 찬 음식을 더 자주 먹는다</label>
    <p>체크한 개수에 따라 체질을 확인할 수 있어요.</p>
    <button onclick="checkResult()" type="button">결과 확인하기</button>
  </form>
  <script>
    function checkResult() {
      const boxes = document.querySelectorAll('input[type="checkbox"]');
      let count = 0;
      boxes.forEach(box => { if (box.checked) count++; });

      let page = '';
      if (count >= 5) page = 'result-warm.html';
      else page = 'result-cold.html';

      document.body.classList.add('fade-out');
      setTimeout(() => { window.location.href = page; }, 600);
    }
  </script>
</body>
</html>
